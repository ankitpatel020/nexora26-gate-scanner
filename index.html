<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEXORA 2026 — Gate Scanner</title>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #222222 0%,
      #0a0a0c 45%,
      #050505 100%
    );

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.container {

  width: 100%;

  max-width: 620px;

  margin: auto;

  padding: 20px;

}


.header {

  text-align: center;

  padding: 20px 0 25px;

}


.small-title {

  color: #d4af37;

  font-size: 12px;

  letter-spacing: 5px;

  font-weight: bold;

}


.logo {

  font-size: 42px;

  font-weight: 900;

  margin-top: 7px;

}


.subtitle {

  color: #aaa;

  margin-top: 7px;

}


.status {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

  margin-top: 15px;

  color: #aaa;

  font-size: 13px;

}


.dot {

  width: 9px;

  height: 9px;

  border-radius: 50%;

  background: #26d97f;

  box-shadow:
    0 0 10px #26d97f;

}


.card {

  background: #0d0d10;

  border: 1px solid #333;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 18px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.35);

}


.scanner {

  overflow: hidden;

  border-radius: 14px;

  background: #000;

}


#reader {

  width: 100%;

}


.manual-title {

  color: #d4af37;

  font-size: 13px;

  font-weight: bold;

  margin-bottom: 10px;

  text-transform: uppercase;

  letter-spacing: 1px;

}


input {

  width: 100%;

  padding: 15px;

  border-radius: 10px;

  border: 1px solid #444;

  background: #151519;

  color: white;

  outline: none;

  font-size: 16px;

}


input:focus {

  border-color: #d4af37;

}


button {

  width: 100%;

  padding: 15px;

  border: 0;

  border-radius: 10px;

  margin-top: 10px;

  background: #d4af37;

  color: #050505;

  font-weight: 900;

  font-size: 15px;

  cursor: pointer;

}


button:active {

  transform: scale(.98);

}


button.secondary {

  background: #242428;

  color: white;

}


button.danger {

  background: #d93434;

  color: white;

}


.result {

  display: none;

  border-radius: 18px;

  padding: 24px;

  margin-top: 18px;

  border: 2px solid;

}


.result.granted {

  display: block;

  border-color: #26d97f;

  background:
    rgba(38,217,127,.08);

}


.result.duplicate {

  display: block;

  border-color: #e5b63f;

  background:
    rgba(229,182,63,.08);

}


.result.rejected {

  display: block;

  border-color: #e04444;

  background:
    rgba(224,68,68,.08);

}


.result-title {

  font-size: 30px;

  font-weight: 900;

  margin-bottom: 18px;

}


.granted .result-title {

  color: #26d97f;

}


.duplicate .result-title {

  color: #e5b63f;

}


.rejected .result-title {

  color: #e04444;

}


.info {

  display: grid;

  grid-template-columns:
    120px 1fr;

  gap: 10px;

  font-size: 14px;

}


.info-label {

  color: #777;

}


.info-value {

  font-weight: bold;

}


.loading {

  display: none;

  text-align: center;

  padding: 15px;

  color: #d4af37;

}


.footer {

  text-align: center;

  color: #555;

  font-size: 11px;

  padding: 20px;

}


.security {

  color: #777;

  text-align: center;

  font-size: 11px;

  line-height: 1.6;

}

</style>

</head>


<body>


<div class="container">


  <div class="header">

    <div class="small-title">
      MASTER FRESHER
    </div>

    <div class="logo">
      NEXORA 2026
    </div>

    <div class="subtitle">
      Front Gate Verification System
    </div>

    <div class="status">

      <span class="dot"></span>

      Scanner Online

    </div>

  </div>


  <!-- CAMERA -->

  <div class="card">

    <div class="manual-title">
      Scan QR Ticket
    </div>

    <div class="scanner">

      <div id="reader"></div>

    </div>

  </div>


  <!-- MANUAL -->

  <div class="card">

    <div class="manual-title">
      Manual Verification
    </div>

    <input
      id="manualInput"
      type="text"
      autocomplete="off"
      placeholder="NEXORA26-001 or QR5281028432126"
    >

    <button
      onclick="manualVerify()"
    >
      VERIFY TICKET
    </button>


    <button
      class="secondary"
      onclick="clearInput()"
    >
      CLEAR
    </button>

  </div>


  <div
    id="loading"
    class="loading"
  >
    VERIFYING TICKET...
  </div>


  <!-- RESULT -->

  <div
    id="result"
    class="result"
  >

    <div
      id="resultTitle"
      class="result-title"
    >
    </div>


    <div
      id="resultInfo"
      class="info"
    >
    </div>


    <button
      onclick="resetScanner()"
    >
      READY FOR NEXT TICKET
    </button>

  </div>


  <div class="security">

    QR verification is performed against the
    central NEXORA registration ledger.<br>

    One verified ticket = one gate entry.

  </div>


  <div class="footer">

    NEXORA 2026 • MASTER FRESHER

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_URL =
  "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";


const SCANNER_SECRET =
  "CHANGE_THIS_GATE_SECRET_2026";


/* =========================================================
   STATE
   ========================================================= */

let scanner = null;

let scannerRunning = false;

let processing = false;


/* =========================================================
   START SCANNER
   ========================================================= */

function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner
    .start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 260,
          height: 260
        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    )
    .then(function() {

      scannerRunning = true;

    })
    .catch(function(error) {

      console.error(
        "Camera start error:",
        error
      );

    });

}


/* =========================================================
   QR SUCCESS
   ========================================================= */

function onScanSuccess(
  decodedText
) {

  if (processing) {

    return;

  }


  processing = true;


  verifyCredential({
    qrCode: decodedText
  });

}


/* =========================================================
   QR FAILURE
   ========================================================= */

function onScanFailure(error) {

  /*
   * Ignore continuous camera decode failures.
   */

}


/* =========================================================
   MANUAL
   ========================================================= */

function manualVerify() {

  if (processing) {

    return;

  }


  const input =
    document
      .getElementById(
        "manualInput"
      )
      .value
      .trim();


  if (!input) {

    showRejected(
      "MISSING CREDENTIAL",
      "Enter a registration ID or QR code."
    );

    return;

  }


  processing = true;


  const upper =
    input.toUpperCase();


  /*
   * Registration
   */
  if (
    upper.indexOf(
      "NEXORA26-"
    ) === 0
  ) {

    verifyCredential({

      regId: upper

    });


    return;

  }


  /*
   * QR
   */
  verifyCredential({

    qrCode: upper

  });

}


/* =========================================================
   VERIFY
   ========================================================= */

async function verifyCredential(
  credential
) {

  showLoading(true);


  try {

    const payload = {

      ...credential,

      secret:
        SCANNER_SECRET

    };


    /*
     * text/plain avoids unnecessary
     * CORS preflight.
     */
    const response =
      await fetch(

        API_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    const data =
      await response.json();


    handleResponse(
      data
    );


  } catch (error) {

    console.error(
      error
    );


    showRejected(
      "SERVER ERROR",
      "Unable to contact the verification server."
    );

  } finally {

    showLoading(false);

  }

}


/* =========================================================
   HANDLE RESPONSE
   ========================================================= */

function handleResponse(
  data
) {

  if (
    data.success === true
  ) {

    showGranted(
      data
    );


    return;

  }


  if (
    data.duplicate === true
  ) {

    showDuplicate(
      data
    );


    return;

  }


  if (
    data.reason ===
    "PAYMENT_NOT_PAID"
  ) {

    showRejected(
      "ENTRY REJECTED",
      "Payment has not been verified.",
      data
    );


    return;

  }


  if (
    data.reason ===
    "PASS_NOT_CONFIRMED"
  ) {

    showRejected(
      "ENTRY REJECTED",
      "Pass has not been confirmed.",
      data
    );


    return;

  }


  if (
    data.reason ===
    "INVALID_CREDENTIAL"
  ) {

    showRejected(
      "ENTRY REJECTED",
      "Registration not found."
    );


    return;

  }


  showRejected(

    "ENTRY REJECTED",

    data.message ||
    "Credential could not be verified."

  );

}


/* =========================================================
   RESULT UI
   ========================================================= */

function showGranted(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result granted";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "ACCESS GRANTED";


  document.getElementById(
    "resultInfo"
  ).innerHTML =
    buildInfo(data);

}


function showDuplicate(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result duplicate";


  document.getElementById(
    "resultTitle"
  ).textContent =
    "ALREADY CHECKED IN";


  document.getElementById(
    "resultInfo"
  ).innerHTML =
    buildInfo(data);

}


function showRejected(
  title,
  message,
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    "result rejected";


  let info =
    "<div class='info-label'>STATUS</div>" +

    "<div class='info-value'>" +
    escapeHtml(message) +
    "</div>";


  if (data) {

    info += buildInfo(
      data
    );

  }


  document.getElementById(
    "resultTitle"
  ).textContent =
    title;


  document.getElementById(
    "resultInfo"
  ).innerHTML =
    info;

}


/* =========================================================
   BUILD INFO
   ========================================================= */

function buildInfo(
  data
) {

  let html = "";


  if (
    data.registrationId
  ) {

    html += row(
      "REGISTRATION",
      data.registrationId
    );

  }


  if (
    data.name
  ) {

    html += row(
      "NAME",
      data.name
    );

  }


  if (
    data.department
  ) {

    html += row(
      "DEPARTMENT",
      data.department
    );

  }


  if (
    data.semester
  ) {

    html += row(
      "SEMESTER",
      data.semester
    );

  }


  if (
    data.category
  ) {

    html += row(
      "CATEGORY",
      data.category
    );

  }


  if (
    data.entryTime
  ) {

    html += row(
      "ENTRY TIME",
      data.entryTime
    );

  }


  return html;

}


function row(
  label,
  value
) {

  return (

    "<div class='info-label'>" +

    escapeHtml(label) +

    "</div>" +

    "<div class='info-value'>" +

    escapeHtml(value) +

    "</div>"

  );

}


/* =========================================================
   LOADING
   ========================================================= */

function showLoading(
  state
) {

  document.getElementById(
    "loading"
  ).style.display =
    state
      ? "block"
      : "none";

}


/* =========================================================
   RESET
   ========================================================= */

async function resetScanner() {

  processing = false;


  document.getElementById(
    "result"
  ).className =
    "result";


  document.getElementById(
    "manualInput"
  ).value = "";


  showLoading(false);

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearInput() {

  document.getElementById(
    "manualInput"
  ).value = "";


  document
    .getElementById(
      "manualInput"
    )
    .focus();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   INITIALIZE
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>

</body>

</html>
